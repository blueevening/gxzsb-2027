<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>广西专升本练习</title>
<script>
  // GitHub Pages 是纯静态托管：任何未匹配路径（404）都回到应用入口，
  // 由应用内的哈希路由接管，避免刷新/分享深链时出现 GitHub 默认 404。
  (function () {
    var base = "index.html";
    var url = base;
    try {
      var h = location.hash;
      if (h) url += h;
    } catch (e) {}
    location.replace(url);
  })();
</script>
</head>
<body style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f6f7fb;color:#555;">
  <p style="font-size:15px;">正在返回应用…如未自动跳转，<a href="index.html" style="color:#2D5BFF;">点这里</a></p>
</body>
</html>
