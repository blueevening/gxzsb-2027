name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check all runtime JS
        run: |
          fail=0
          for f in *.js; do
            if ! node --check "$f"; then echo "::error::syntax failed $f"; fail=1; fi
          done
          exit $fail
      - name: Lint question bank
        run: node scripts/lint-bank.js
      - name: Smoke tests
        run: node scripts/smoke.js
