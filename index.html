<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>广西专升本练习 · gxzsb</title>
<link rel="icon" href="data:," />
<script>
/* 首帧即应用持久化主题，避免深色用户加载页闪白 */
(function () {
  try { if (localStorage.getItem("gxzsb.theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
})();
</script>
<link rel="stylesheet" href="styles.css?v=460" />
</head>
<body>
  <header class="topbar">
    <button class="back" id="btnBack" type="button" aria-label="返回">←</button>
    <span class="title" id="pageTitle">广西专升本练习</span>
    <button class="icon-btn" id="btnSearch" type="button" aria-label="搜索">🔍</button>
    <button class="icon-btn" id="btnTheme" type="button" aria-label="切换主题">◐</button>
  </header>

  <div class="app-frame">
    <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>
    <main class="shell">
      <div id="app"></div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="底部导航"></nav>

<script>
/* SW：仅在 http(s) 下注册（file:// 双击打开时跳过，不影响使用） */
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
<script defer src="boot.js?v=460"></script>
</body>
</html>
