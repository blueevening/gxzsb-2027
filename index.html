<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<title>广西专升本练习 · gxzsb</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#2563eb" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="专升本" />
<link rel="icon" href="data:," />
<script>
/* 首帧即应用持久化主题，避免深色用户加载页闪白 */
(function () {
  try { if (localStorage.getItem("gxzsb.theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
})();
</script>
<link rel="stylesheet" href="styles.css?v=2.5.1" />
</head>
<body>
  <div id="offlineBar" hidden>📡 离线模式 · 数据存本地，联网后自动同步</div>
  <div id="syncBar" class="sync-bar"><span class="sync-bar-dot" id="syncBarDot"></span><span id="syncBarText">📱 本地模式 · 进度保存在本机</span></div>
  <header class="topbar">
    <button class="back" id="btnBack" type="button" aria-label="返回">←</button>
    <span class="title" id="pageTitle">广西专升本练习</span>
    <button class="icon-btn" id="btnSearch" type="button" aria-label="搜索">🔍</button>
    <button class="icon-btn" id="btnTheme" type="button" aria-label="切换主题">◐</button>
  </header>

  <div class="app-frame">
    <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>
    <main class="shell">
      <div id="app">
        <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
          <div style="height:120px;border-radius:12px;background:var(--border,#e2e8f0);animation:pulse 1.2s infinite"></div>
          <div style="height:60px;border-radius:12px;background:var(--border,#e2e8f0);animation:pulse 1.2s infinite"></div>
          <div style="height:60px;border-radius:12px;background:var(--border,#e2e8f0);animation:pulse 1.2s infinite"></div>
          <p style="text-align:center;color:var(--text-sub,#94a3b8);font-size:12px;margin-top:8px">正在加载…</p>
        </div>
      </div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="底部导航"></nav>

<script>
/* 离线状态提示 + 联网恢复轻提示 */
(function () {
  var bar = document.getElementById('offlineBar');
  function toastRestore() {
    var t = document.createElement('div');
    t.textContent = '✅ 网络已恢复，正在同步进度…';
    t.style.cssText = 'position:fixed;top:32px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:10000;box-shadow:0 4px 12px rgba(0,0,0,.2)';
    document.body.appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; setTimeout(function () { t.remove(); }, 400); }, 2500);
  }
  var wasOffline = false;
  function sync() {
    if (bar) bar.hidden = navigator.onLine;
    if (!navigator.onLine) { wasOffline = true; }
    else if (wasOffline) { wasOffline = false; toastRestore(); }
  }
  window.addEventListener('online', sync);
  window.addEventListener('offline', sync);
  sync();
})();
/* SW：仅在 http(s) 下注册（file:// 双击打开时跳过，不影响使用） */
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    // 后台静默预载题库（进 app 后自动缓存，不打扰用户）
    setTimeout(function () {
      ['math-bank.js','english-bank.js','ee-bank.js','c-bank.js','net-bank.js','wordbook.js','formula-book.js'].forEach(function (f) {
        fetch(f + '?v=auto', { cache: 'force-cache' }).catch(function () {});
      });
    }, 3000);
  });
}
</script>
<script defer src="boot.js?v=2.5.1"></script>
</body>
</html>
