<script>
/* 首帧即应用持久化主题，避免深色用户加载页闪白 */
(function () {
  try { if (localStorage.getItem("gxzsb.theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
})();
</script>
<style>
/* 关键路径内联：首屏骨架样式，避免 styles.css 加载前的布局跳动（CLS） */
html,body{margin:0;padding:0;background:#F7F8FA;color:#1A1D26;-webkit-text-size-adjust:100%;overflow-x:hidden}
[data-theme="dark"] body{background:#0F1115;color:#E8EAF0}
#offlineBar{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#DC2626;color:#fff;font-size:12px;text-align:center;padding:6px 12px}
#offlineBar[hidden]{display:none}
.sync-bar{position:fixed;top:0;left:0;right:0;z-index:49;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(45,91,255,.08);color:#2D5BFF;font-size:11px;padding:4px 12px}
.sync-bar-dot{width:8px;height:8px;border-radius:50%;background:#2D5BFF;display:inline-block}
.topbar{position:sticky;top:0;z-index:50;height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#F7F8FA;border-bottom:1px solid #E8EAEE}
[data-theme="dark"] .topbar{background:#0F1115;border-color:#2A2D38}
.topbar .title{flex:1;min-width:0;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar button{width:44px;height:44px;border-radius:10px;border:1px solid #E8EAEE;background:#fff;color:inherit;font-size:18px;display:grid;place-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[data-theme="dark"] .topbar button{background:#1A1D24;border-color:#2A2D38}
.app-frame{min-height:calc(100vh - 56px)}
.shell{padding:16px;max-width:860px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:60px;background:#fff;border-top:1px solid #E8EAEE;display:grid;grid-template-columns:repeat(5,1fr)}
[data-theme="dark"] .tabbar{background:#1A1D24;border-color:#2A2D38}
.skeleton{height:120px;border-radius:14px;background:#E8EAEE;animation:gxzsbPulse 1.2s infinite}
.skeleton.sm{height:60px}
[data-theme="dark"] .skeleton{background:#2A2D38}
@keyframes gxzsbPulse{0%,100%{opacity:1}50%{opacity:.5}}
@media(min-width:1200px){
  .shell{padding:24px 32px}
  .tabbar{display:none}
}
</style>
<link rel="stylesheet" href="styles.css?v=2.7.0">
</head>
<body>
  <div id="offlineBar" hidden>📡 离线模式 · 数据存本地，联网后自动同步</div>
  <div class="sync-bar" id="syncBar"><span class="sync-bar-dot" id="syncBarDot"></span><span id="syncBarText">📱 本地模式 · 进度保存在本机</span></div>
  <header class="topbar">
    <button class="back" id="btnBack" type="button" aria-label="返回">←</button>
    <span class="title" id="pageTitle">广西专升本练习</span>
    <button class="icon-btn" id="btnSearch" type="button" aria-label="搜索">🔍</button>
    <button class="icon-btn" id="btnTheme" type="button" aria-label="切换主题">◐</button>
  </header>

  <div class="app-frame">
    <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>
    <main class="shell">
      <div id="app">
        <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
          <div class="skeleton"></div>
          <div class="skeleton sm"></div>
          <div class="skeleton sm"></div>
          <p style="text-align:center;color:#6B7280;font-size:12px;margin-top:8px">正在加载…</p>
        </div>
      </div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="底部导航"></nav>

<script>
/* 离线状态提示 + 联网恢复轻提示 */
(function () {
  var bar = document.getElementById('offlineBar');
  function toastRestore() {
    var t = document.createElement('div');
    t.textContent = '✅ 网络已恢复，正在同步进度…';
    t.style.cssText = 'position:fixed;top:32px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:10000;box-shadow:0 4px 12px rgba(0,0,0,.2)';
    document.body.appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; setTimeout(function () { t.remove(); }, 400); }, 2500);
  }
  var wasOffline = false;
  function sync() {
    if (bar) bar.hidden = navigator.onLine;
    if (!navigator.onLine) { wasOffline = true; }
    else if (wasOffline) { wasOffline = false; toastRestore(); }
  }
  window.addEventListener('online', sync);
  window.addEventListener('offline', sync);
  sync();
})();
/* SW：仅在 http(s) 下注册（file:// 双击打开时跳过，不影响使用） */
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    // 后台静默预载题库（进 app 后自动缓存，不打扰用户）
    setTimeout(function () {
      ['math-bank.js','english-bank.js','ee-bank.js','c-bank.js','net-bank.js','wordbook.js','formula-book.js'].forEach(function (f) {
        fetch(f + '?v=auto', { cache: 'force-cache' }).catch(function () {});
      });
    }, 3000);
  });
}
</script>
<script defer src="boot.js?v=2.7.0"></script>
</body>
</html>
